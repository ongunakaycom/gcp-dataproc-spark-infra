name: Terraform CI

###############################################################################
# Runs on every push to main and on every pull request targeting main.
#
# Jobs:
#   format      - terraform fmt -check
#   validate    - terraform init -backend=false + terraform validate
#   tflint      - TFLint with the Terraform and Google rulesets
#   security    - Checkov and tfsec static analysis
#   secret-scan - Gitleaks secret detection
#   destructive - warns when a change deletes resources (static diff, or a
#                 live plan when Workload Identity Federation is configured)
#   plan        - syntax-only "plan" stage (no live GCP credentials)
#
# Live GCP access is intentionally disabled. See the commented Workload
# Identity Federation (WIF) block in the `plan` job for the production setup.
###############################################################################

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TFLINT_CONFIG: ${{ github.workspace }}/.tflint.hcl

jobs:
  format:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        working-directory: terraform
        run: terraform fmt -check -recursive -diff

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize Terraform (no backend)
        working-directory: terraform
        run: terraform init -backend=false -input=false -no-color

      - name: Validate configuration
        working-directory: terraform
        run: terraform validate -no-color

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize TFLint plugins
        working-directory: terraform
        run: tflint --init --config="${TFLINT_CONFIG}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        working-directory: terraform
        run: tflint --recursive --format compact --config="${TFLINT_CONFIG}"

  security:
    name: Security Scan (Checkov + tfsec)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Static analysis of the Terraform configuration. `soft_fail` keeps the
      # workflow informative instead of blocking the portfolio build; set it to
      # false (or remove it) to make findings fail the build.
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          soft_fail: true

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  destructive-change:
    name: Destructive Change Guard
    runs-on: ubuntu-latest
    needs: [format, validate]
    env:
      # Empty unless Workload Identity Federation is configured.
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Without credentials there is no live plan to inspect, so the guard
      # falls back to the diff: removed resource/module blocks and changes to
      # destroy-related settings are surfaced as warnings.
      - name: Detect destructive changes (static diff)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [ -n "${GCP_PROJECT_ID:-}" ]; then
            echo "GCP credentials are configured; the live plan guard below is authoritative."
            exit 0
          fi

          base="${BASE_SHA:-}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-count=1 --skip=1 HEAD 2>/dev/null || true)"
          fi

          if [ -z "$base" ]; then
            echo "No previous commit to compare against; skipping the static guard."
            exit 0
          fi

          diff="$(git diff --unified=0 "$base" HEAD -- terraform || true)"
          removed="$(printf '%s\n' "$diff" | grep -E '^-(resource|module) ' || true)"
          risky="$(printf '%s\n' "$diff" | grep -E '^[+-].*(force_destroy|deletion_protection)' || true)"

          {
            echo "### Destructive change guard (static diff)"
            echo ""
            if [ -n "$removed" ] || [ -n "$risky" ]; then
              echo "Potential destructive Terraform change detected — review the plan before applying."
              echo ""
              echo '```diff'
              printf '%s\n%s\n' "$removed" "$risky" | sed '/^$/d'
              echo '```'
            else
              echo "No resource deletions or destroy-related changes detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$removed" ] || [ -n "$risky" ]; then
            echo "::warning::Potential destructive Terraform change detected — review the plan before applying."
          fi

      - name: Set up Terraform
        if: env.GCP_PROJECT_ID != ''
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        if: env.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Terraform plan and scan for destroys
        if: env.GCP_PROJECT_ID != ''
        working-directory: terraform
        run: |
          set -euo pipefail

          terraform init -input=false -no-color

          set +e
          terraform plan \
            -input=false \
            -no-color \
            -lock=false \
            -var="project_id=${GCP_PROJECT_ID}" \
            -out=tfplan
          status=$?
          set -e

          if [ "$status" -eq 1 ]; then
            echo "::error::terraform plan failed"
            exit 1
          fi

          terraform show -json tfplan > plan.json
          python3 ../scripts/check_plan_destroys.py plan.json

  plan:
    name: Terraform Plan (syntax-only)
    runs-on: ubuntu-latest
    needs: [format, validate, tflint]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      #########################################################################
      # Workload Identity Federation (WIF) authentication — DISABLED
      #
      # This portfolio repository does not own a live GCP project, so no
      # credentials are configured and the live plan below is skipped.
      #
      # To enable real plans:
      #   1. Create a WIF pool/provider and a Terraform service account.
      #   2. Add these repository secrets:
      #        GCP_WORKLOAD_IDENTITY_PROVIDER
      #        GCP_SERVICE_ACCOUNT
      #        GCP_PROJECT_ID
      #   3. Uncomment the block below and the "Live plan" step at the bottom.
      #
      # - name: Authenticate to Google Cloud
      #   id: auth
      #   uses: google-github-actions/auth@v3
      #   with:
      #     workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      #     service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      #     create_credentials_file: true
      #########################################################################
      - name: WIF authentication (disabled)
        run: |
          echo "::notice::Workload Identity Federation is intentionally disabled."
          echo "No live GCP credentials are configured for this repository."
          echo "See README.md → 'Enabling live plans with Workload Identity Federation'."

      - name: Initialize Terraform (no backend)
        working-directory: terraform
        run: terraform init -backend=false -input=false -no-color

      # Without credentials Terraform cannot read the google_project data
      # source, so this stage exercises the configuration graph with validate
      # instead of a live plan. This is the only check that runs in CI today.
      - name: Terraform plan (syntax-only)
        working-directory: terraform
        run: |
          terraform validate -no-color

          {
            echo "### Terraform plan (syntax-only)"
            echo ""
            echo "A live plan was skipped because no GCP credentials are configured."
            echo "The configuration passed \`terraform validate\` and \`terraform fmt -check\`."
            echo ""
            echo "To run the real plan locally:"
            echo ""
            echo '```bash'
            echo 'terraform plan -input=false -var="project_id=${PROJECT_ID}"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      #########################################################################
      # Live plan — uncomment together with the WIF authentication block.
      #
      # - name: Terraform plan (live)
      #   working-directory: terraform
      #   run: |
      #     terraform plan \
      #       -input=false \
      #       -no-color \
      #       -lock=false \
      #       -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
      #       -out=tfplan
      #########################################################################
