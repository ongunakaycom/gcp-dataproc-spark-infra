# Pre-commit hooks for Terraform, linting, and secret detection.
#
# Install once per clone:
#   pip install pre-commit        # or: pipx install pre-commit
#   pre-commit install
#
# Run against the whole repository:
#   pre-commit run --all-files
#
# Dependencies used by the Terraform hooks (terraform, tflint) must be on PATH.

default_stages: [pre-commit]
fail_fast: false

repos:
  # ---------------------------------------------------------------------------
  # Generic file hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        # The README preview GIF is intentionally larger than the 500 KB
        # default; cap it at 2 MB so accidental media drops still fail.
        args: [--maxkb=2048]
      - id: detect-private-key

  # ---------------------------------------------------------------------------
  # Terraform: formatting, validation and linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
        args:
          - --args=-diff
          - --args=-recursive
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
          - --args=--format=compact

  # ---------------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
